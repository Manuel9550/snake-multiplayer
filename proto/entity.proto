syntax = "proto3";

option go_package = "/gen/models";

enum EntityType {
    ENTITY_TYPE_UNKNOWN = 0;
    ENTITY_TYPE_WALL = 1;
    ENTITY_TYPE_POINT = 2;
    ENTITY_TYPE_BODY = 3;
}

message BodyField {
    int32 X = 1;
    int32 Y = 2;
}

message Entity {
    string ID = 1;
    string PlayerID = 2;
    BodyField Body = 3;
    EntityType Type = 4; 
}