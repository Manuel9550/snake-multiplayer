syntax = "proto3";

option go_package = "/gen/models";

import "inputs.proto";
import "entity.proto";
import "server.proto";

enum MessageType {
    MESSAGE_TYPE_UNKNOWN = 0;
    MESSAGE_TYPE_WELCOME = 1;
    MESSAGE_TYPE_PLAYER_STATES = 2;
    MESSAGE_TYPE_SERVER_STATE = 3;
    MESSAGE_TYPE_PLAYER = 4;
    MESSAGE_TYPE_GAME_DATA = 5;
    MESSAGE_TYPE_GAME_OVER = 6;
}

message Welcome {
    string PlayerID = 1;
    string SessionID = 2;
    string Colour = 3;
}

message PlayerStates {
    repeated PlayerState PlayerStates = 1;
}

message Player {
    string PlayerID = 1;
    repeated BodyField Body = 2;
    Direction PlayerDirection = 3;
    BodyField Head = 4;
    string Colour = 5;
}

message GameData {
    repeated Player PlayerData = 1;
    repeated Entity EntityData = 2;
}

message Envelope {
    MessageType Type = 1;
    oneof MessageData {
    Welcome PlayerData = 2;
    PlayerStates PlayerStates = 3;
    ServerStateMessage ServerState = 4;
    Player Data = 5;
    GameData GameState = 6;
    GameOver GameOver = 7;
  }
}