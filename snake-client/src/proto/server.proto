syntax = "proto3";

option go_package = "/gen/models";

enum ServerState {
    SERVER_STATE_UNKNOWN = 0;
    SERVER_STATE_INITIALIZING = 1;
    SERVER_STATE_SETUP = 2;
    SERVER_STATE_RUNNING = 3;
    SERVER_STATE_DONE = 4;
}

message ServerStateMessage {
    string SessionID = 1;
    ServerState ServerState = 2;
}

message GameOver {
    string SessionID = 1;
    string WinningPlayerID = 2;
}