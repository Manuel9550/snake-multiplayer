syntax = "proto3";

option go_package = "/gen/models";

import "inputs.proto";

enum EntityType {
    ENTITY_TYPE_UNKNOWN = 0;
    ENTITY_TYPE_WALL = 1;
    ENTITY_TYPE_POINT = 2;
    ENTITY_TYPE_BODY = 3;
}

enum PlayerState {
    STATE_UNKNOWN = 0;
    STATE_CONNECTING = 1;
    STATE_CONNECTED = 2;
    STATE_READY = 3;
    STATE_PLAYING = 4;
    STATE_DONE = 5;
}

message BodyField {
    int32 X = 1;
    int32 Y = 2;
}

message Entity {
    string ID = 1;
    string PlayerID = 2;
    BodyField Body = 3;
    EntityType Type = 4; 
}


message Player {
    string PlayerID = 1;
    repeated BodyField Body = 2;
    Direction PlayerDirection = 3;
    BodyField Head = 4;
    string Colour = 5;
    PlayerState State = 6;
}

message GameData {
    repeated Player PlayerData = 1;
    repeated Entity EntityData = 2;
}