syntax = "proto3";

option go_package = "/gen/models";

enum Direction {
    DIRECTION_UNKNOWN = 0;
    DIRECTION_UP = 1;
    DIRECTION_DOWN = 2;
    DIRECTION_LEFT = 3;
    DIRECTION_RIGHT = 4;
}

message Input {
    string PlayerID = 1;
    Direction InputType = 2;
}

message ReadyUp {
    string PlayerID = 1;
}